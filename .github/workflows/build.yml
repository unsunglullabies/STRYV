name: STRYV build

# Two jobs on purpose:
#   build   - always compiles and, when signing secrets are available, produces a
#             signed installer plus the updater manifest.
#   release - publishes to GitHub Releases ONLY on a v* tag or an explicit
#             "publish" dispatch. Never runs on a pull request.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a GitHub Release from this build"
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build and sign
    runs-on: windows-latest
    # Repository secrets are not injected automatically; they must be mapped to
    # the environment variables the Tauri CLI reads while signing.
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      # Without this every build re-compiles every Rust dependency from scratch,
      # which costs ~6 minutes. With it, an unchanged dependency tree is reused
      # and only the changed crates rebuild, which is roughly 1-2 minutes.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Frontend tests
        run: npm test

      # Secrets are not exposed to pull requests from forks, so signing only
      # happens where the secrets exist. A pull request still proves it compiles.
      - name: Check signing secrets are present
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            throw "TAURI_SIGNING_PRIVATE_KEY is not set. Add it as a repository secret or this build cannot be released."
          }
          Write-Output "TAURI_SIGNING_PRIVATE_KEY is set."

      # A push to main only has to prove the code still compiles. Packaging an
      # installer, signing it and writing updater artifacts costs minutes and is
      # only needed for an actual release, so all of that is skipped unless this
      # run was triggered by a v* tag.
      - name: Compile check (no installer)
        if: github.ref_type != 'tag'
        shell: pwsh
        run: npm run build:fast

      - name: Build release installer
        if: github.ref_type == 'tag'
        shell: pwsh
        run: npm run build

      # Generated from the app's own CHANGELOG so the release body and the
      # in-app What's New page cannot say different things. Fails if the version
      # being tagged has no changelog entry, which stops a release shipping with
      # nothing to show for it.
      - name: Generate release notes
        if: github.ref_type == 'tag'
        shell: pwsh
        run: node scripts/release-notes.js | Out-File -FilePath release-notes.md -Encoding utf8

      # Refuses to run if any installer lacks a signature, so an unsigned
      # artifact can never reach a release.
      - name: Generate updater manifest
        if: github.ref_type == 'tag' && github.event_name != 'pull_request'
        shell: pwsh
        env:
          RELEASE_NOTES_FILE: release-notes.md
        run: node scripts/make-latest-json.js

      - name: Upload build artifacts
        if: always() && github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: stryv-installer
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.sig
            src-tauri/target/release/bundle/latest.json

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    # Only a v* tag, or a manual dispatch that explicitly asked to publish.
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    permissions:
      contents: write
    steps:
      # gh resolves the target repository from the local git remote, so this job
      # needs a checkout. Without one, "gh release create" has no repository to
      # act on and fails.
      - uses: actions/checkout@v4

      # Regenerated here rather than handed over from the build job: this job got
      # its own checkout, and the notes are derived from a file inside it.
      - name: Generate release notes
        shell: bash
        run: node scripts/release-notes.js > release-notes.md

      - uses: actions/download-artifact@v4
        with:
          name: stryv-installer
          path: dist

      # Derive the tag from the pushed tag, or from package.json on a manual
      # dispatch, so the version is never duplicated in this file.
      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${{ github.ref_name }}"
          else
            tag="v$(node -p "require('./package.json').version")"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "releasing $tag"

      - name: Show what will be published
        run: ls -l dist

      # gh ships with the runner, so no third-party release action is needed.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          # download-artifact keeps the nsis/ and msi/ subdirectories, so a
          # plain "dist/*" glob hands gh the directories themselves and it
          # fails with "read dist/nsis: is a directory". Collect real files.
          mapfile -t assets < <(find dist -type f | sort)
          echo "Publishing ${#assets[@]} assets:"
          printf '  %s\n' "${assets[@]}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; updating its assets."
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            # The body is the real changelog from src/core.js rather than
            # --generate-notes, which summarised commit messages and left people
            # with a list of hashes instead of what changed.
            gh release create "$TAG" "${assets[@]}" --title "STRYV $TAG" \
              --notes-file release-notes.md
          fi
