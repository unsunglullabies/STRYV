name: STRYV build

# Two jobs on purpose:
#   build   - always compiles and, when signing secrets are available, produces a
#             signed installer plus the updater manifest.
#   release - publishes to GitHub Releases ONLY on a v* tag or an explicit
#             "publish" dispatch. Never runs on a pull request.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a GitHub Release from this build"
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build and sign
    runs-on: windows-latest
    # Repository secrets are not injected automatically; they must be mapped to
    # the environment variables the Tauri CLI reads while signing.
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Frontend tests
        run: npm test

      # Secrets are not exposed to pull requests from forks, so signing only
      # happens where the secrets exist. A pull request still proves it compiles.
      - name: Check signing secrets are present
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            throw "TAURI_SIGNING_PRIVATE_KEY is not set. Add it as a repository secret or this build cannot be released."
          }
          Write-Output "TAURI_SIGNING_PRIVATE_KEY is set."

      - name: Build
        shell: pwsh
        run: npm run build

      # Refuses to run if any installer lacks a signature, so an unsigned
      # artifact can never reach a release.
      - name: Generate updater manifest
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: node scripts/make-latest-json.js

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stryv-installer
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.sig
            src-tauri/target/release/bundle/latest.json

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    # Only a v* tag, or a manual dispatch that explicitly asked to publish.
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: stryv-installer
          path: dist

      - name: Show what will be published
        run: ls -l dist

      # gh ships with the runner, so no third-party release action is needed.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', github.event.inputs.version || '0.2.0') }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; updating its assets."
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "STRYV $TAG" --generate-notes
          fi
