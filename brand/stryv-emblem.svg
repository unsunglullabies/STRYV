<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="STRYV">
<!--
  App / favicon mark. Near-black octagon, amber Y, matching the wordmark and
  the product's --v token (#F5A623). The earlier version used violet, which did
  not appear anywhere else in STRYV.
-->
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14141A"/>
      <stop offset="1" stop-color="#08080C"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC24D"/>
      <stop offset="1" stop-color="#F5A623"/>
    </linearGradient>
  </defs>

  <path fill="url(#face)" stroke="#2A2A33" stroke-width="4"
        d="M68 10H188L246 68V188L188 246H68L10 188V68Z"/>

  <path fill="none" stroke="url(#amber)" stroke-width="26" stroke-linejoin="miter"
        d="M78 66L128 132M178 66L128 132M128 132V196"/>

  <path fill="#F5A623" opacity=".9" d="M96 214H160L128 176Z"/>
